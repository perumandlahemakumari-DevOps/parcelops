name: ParcelOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-checks:
    name: Build and run API checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests in the isolated test container
        run: docker compose --profile test run --build --rm tests
